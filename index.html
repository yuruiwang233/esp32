<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESP32-S3 测试</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">ESP32-S3 BLE Controller</p>
          <h1>蓝牙遥控测试</h1>
        </div>
        <button id="connectButton" class="primary-button" type="button">
          连接蓝牙
        </button>
      </section>

      <section class="status-panel" aria-live="polite">
        <div>
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">未连接</span>
        </div>
        <span id="lastCommand">等待指令</span>
      </section>

      <section class="speed-panel">
        <label for="speedSlider">速度</label>
        <input id="speedSlider" type="range" min="80" max="255" value="180" />
        <output id="speedValue" for="speedSlider">180</output>
      </section>

      <section class="control-pad" aria-label="方向控制">
        <button class="control-button up" type="button" data-command="F">前进</button>
        <button class="control-button left" type="button" data-command="L">左转</button>
        <button class="control-button stop" type="button" data-command="S">停止</button>
        <button class="control-button right" type="button" data-command="R">右转</button>
        <button class="control-button down" type="button" data-command="B">后退</button>
      </section>

      <section class="command-map">
        <span>W / ↑ 前进</span>
        <span>S / ↓ 后退</span>
        <span>A / ← 左转</span>
        <span>D / → 右转</span>
        <span>空格 停止</span>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
